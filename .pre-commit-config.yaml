# Install once: `uv run pre-commit install` (installs both hook types below).
# Hooks run the tools locked in uv.lock through `uv run`: a single environment, so no version
# drift with CI. File scope comes only from [tool.ruff] in pyproject.toml (same commands as CI).
default_install_hook_types: [pre-commit, commit-msg]
# Without this, hooks with no `stages` also run at commit-msg time (ruff twice per commit).
default_stages: [pre-commit, manual]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format .
        language: system
        pass_filenames: false
        always_run: true
      - id: commitlint
        name: commitlint
        # fixup!/squash!/amend! allowed locally (git rebase --autosquash); CI rejects them
        entry: uv run --locked python scripts/lint_commit_msg.py --allow-autosquash --file
        language: system
        stages: [commit-msg]
