name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Same commands as in README.md (single source: `uv run ...`, pytest options in pyproject.toml).
# `uv sync --locked` fails if uv.lock is out of date with pyproject.toml instead of fixing it.
jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.19"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.19"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Delivered models intact and linked to their provenance
        run: uv run python scripts/check_deliverables.py
      - name: uv run pytest
        # explicit `shell: bash` adds -o pipefail, so a pytest failure is not masked by tee
        shell: bash
        run: uv run pytest | tee pytest.log
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Pytest'
            echo '```'
            tail -n 40 pytest.log 2>/dev/null || echo 'pytest did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  training:
    name: Training and ONNX
    # The Pytest job has no torch and skips slow tests: this job is the only one that trains,
    # resumes and exports an agent, in the tournament CPU image. It also checks that each
    # delivered agent.py is the generated source.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.19"
      - name: Pin the training stack to uv.lock
        run: uv export --frozen --no-hashes --no-emit-project --all-groups -o constraints.txt
      - name: Build the tournament CPU image
        run: docker build -t crashlearn-sim:ci -f vendor/simulation/Dockerfile vendor/simulation
      - name: Train, resume and verify an exported agent on CPU
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e PYTHONPATH=/workspace/src \
            crashlearn-sim:ci sh -c '
              python -m pip install -c constraints.txt gymnasium stable-baselines3 wandb &&
              python -m pytest -m "slow or not slow" tests/test_train_ppo.py tests/test_export.py \
                tests/test_submission_contract.py
            '
