[project]
name = "crashlearn"
version = "0.1.0"
description = "Crash & Learn: autonomous racing agents trained with reinforcement learning"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "numba>=0.67.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff==0.16.7",
]
train = [
    "stable-baselines3>=2.9.0",
    "torch>=2.14.0",
    "wandb>=0.30.0",
]
inference = [
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
# inference (numpy + onnxruntime) is light and needed to load submission agents in tests.
default-groups = ["dev", "inference"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Same defaults locally and in CI; run excluded tests with `uv run pytest -m slow`.
addopts = "--strict-markers -rs -m 'not slow and not gpu'"
markers = [
    "slow: long-running test, excluded by default",
    "gpu: requires CUDA, excluded by default",
]
